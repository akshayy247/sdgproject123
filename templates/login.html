{% extends 'base.html' %}{% block title %}Student Login{% endblock %}{% block content %}
<div class="auth-shell"><div class="container d-flex justify-content-center py-5"><div class="auth-card">
<div class="text-center mb-4"><div class="auth-icon mb-3"><i class="bi bi-person-lock"></i></div><h2 class="fw-bold">Welcome back</h2><p class="text-muted mb-0">Sign in to continue your stress assessment journey.</p></div>
{% if error %}<div class="alert alert-danger rounded-3">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label fw-semibold">Username</label><div class="input-group"><span class="input-group-text bg-white border-end-0"><i class="bi bi-person"></i></span><input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" required></div></div><div class="mb-4"><label class="form-label fw-semibold">Password</label><div class="input-group"><span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span><input type="password" name="password" class="form-control border-start-0" placeholder="Enter password" required></div></div><button class="btn btn-primary w-100 py-3 rounded-3 fw-bold">Login <i class="bi bi-arrow-right ms-1"></i></button></form>
<p class="text-center text-muted mt-4 mb-0">New student? <a href="/signup/" class="fw-bold" style="color:var(--primary)">Create an account</a></p>
</div></div></div>{% endblock %}
